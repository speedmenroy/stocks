<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期權股息收息計算器</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; background-color: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #333; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .result { font-size: 1.2em; color: #2c3e50; margin-top: 15px; font-weight: bold; }
        .highlight { color: #27ae60; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🧮 期權年化回報計算器</h2>
        <div class="input-group">
            <label>行使價 (Strike Price $):</label>
            <input type="number" id="strike" value="50" oninput="calculateOption()">
        </div>
        <div class="input-group">
            <label>期權金 (Premium $):</label>
            <input type="number" id="premium" value="1.2" step="0.1" oninput="calculateOption()">
        </div>
        <div class="input-group">
            <label>距離到期天數 (Days):</label>
            <input type="number" id="days" value="30" oninput="calculateOption()">
        </div>
        
        <div class="result">
            單次收益率: <span id="yieldResult" class="highlight">2.40</span>%<br>
            預估年化回報率: <span id="annualResult" class="highlight">29.20</span>%
        </div>
    </div>

    <div style="font-size: 0.85em; color: #7f8c8d; text-align: center;">
        提示：將此檔案儲存在手機或電腦，點開即可隨時計算 Short Put / Covered Call 回報。
    </div>

    <script>
        function calculateOption() {
            // 獲取輸入值
            const strike = parseFloat(document.getElementById('strike').value) || 0;
            const premium = parseFloat(document.getElementById('premium').value) || 0;
            const days = parseInt(document.getElementById('days').value) || 0;

            if (strike > 0 && days > 0) {
                // 計算單次收益率
                const premiumYield = (premium / strike) * 100;
                // 計算年化回報率
                const annualizedReturn = premiumYield * (365 / days);

                // 顯示結果
                document.getElementById('yieldResult').innerText = premiumYield.toFixed(2);
                document.getElementById('annualResult').innerText = annualizedReturn.toFixed(2);
            } else {
                document.getElementById('yieldResult').innerText = "0.00";
                document.getElementById('annualResult').innerText = "0.00";
            }
        }
        // 初始化計算
        calculateOption();
    </script>
</body>
</html>
